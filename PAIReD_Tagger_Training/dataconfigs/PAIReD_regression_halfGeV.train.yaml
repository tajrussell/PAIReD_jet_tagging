  - jet1_pnet_CvL
  - jet1_pnet_CvB
  - jet1_part_B
  - jet1_part_CvL
  - jet1_part_CvB
  - jet2_pnet_B
  - jet2_pnet_CvL
  - jet2_pnet_CvB
  - jet2_part_B
  - jet2_part_CvL
  - jet2_part_CvB
  - jet1_hadronFlavour
  - jet2_hadronFlavour
  - jet1_pt
  - jet1_eta
  - jet1_phi
  - jet1_energy
